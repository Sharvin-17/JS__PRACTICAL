<!DOCTYPE html>
<html>
<head>
<title>Form Elements</title>
</head>
<body>

<h1>Student Registration Form</h1>

<form>
Name:
<input type="text" id="name">
<br><br>

Password:
<input type="password" id="pass">
<br><br>

Gender:
<input type="radio" name="gender" id="male" value="Male">Male
<input type="radio" name="gender" id="female" value="Female">Female
<br><br>

Hobbies:
<input type="checkbox" id="reading">Reading
<input type="checkbox" id="sports">Sports
<input type="checkbox" id="music">Music
<br><br>

Address:
<textarea id="address"></textarea>
<br><br>

<input type="button" value="Submit" onclick="display_data()">
<input type="reset" value="Reset">
</form>

<h2>Output:</h2>
<div id="output"></div>

<script>
function display_data() {

let name = document.getElementById("name").value;
let pass = document.getElementById("pass").value;

let gender = "";

if (document.getElementById("male").checked) {
    gender = "Male";
}

if (document.getElementById("female").checked) {
    gender = "Female";
}

let hobbies = "";

if (document.getElementById("reading").checked) {
    hobbies += "Reading ";
}

if (document.getElementById("sports").checked) {
    hobbies += "Sports ";
}

if (document.getElementById("music").checked) {
    hobbies += "Music ";
}

let address = document.getElementById("address").value;

document.getElementById("output").innerHTML =
"Name: " + name + "<br>" +
"Password: " + pass + "<br>" +
"Gender: " + gender + "<br>" +
"Hobbies: " + hobbies + "<br>" +
"Address: " + address;
}
</script>

</body>
</html>

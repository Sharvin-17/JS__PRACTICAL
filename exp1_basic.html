<!DOCTYPE html>
<html>
<head>
<title>Basic JavaScript</title>
</head>
<body>

<h1>Basic JavaScript Programs</h1>

<script>
let a = 10;
let b = 5;

document.write("<h3>Arithmetic Operations</h3>");
document.write("Addition: " + (a + b) + "<br>");
document.write("Subtraction: " + (a - b) + "<br>");
document.write("Multiplication: " + (a * b) + "<br>");
document.write("Division: " + (a / b) + "<br>");

document.write("<h3>Message Printing</h3>");
document.write("Welcome to JavaScript!<br>");

document.write("<h3>Decision Making</h3>");
let num = 10;

if (num % 2 == 0) {
    document.write(num + " is Even<br>");
} else {
    document.write(num + " is Odd<br>");
}

document.write("<h3>Looping</h3>");

for (let i = 1; i <= 5; i++) {
    document.write(i + "<br>");
}
</script>

</body>
</html>

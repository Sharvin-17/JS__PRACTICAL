<!DOCTYPE html>
<html>
<head>
<title>String Methods</title>
</head>
<body>

<h1>JavaScript String Methods</h1>

<script>
let str = "Jacky";

document.write("Original String: " + str + "<br>");
document.write("Length: " + str.length + "<br>");
document.write("Uppercase: " + str.toUpperCase() + "<br>");
document.write("Lowercase: " + str.toLowerCase() + "<br>");
document.write("Character at Index 2: " + str.charAt(2) + "<br>");
document.write("Substring (0, 3): " + str.substring(0, 3) + "<br>");
document.write("Slice (1, 4): " + str.slice(1, 4) + "<br>");
document.write("Replace: " + str.replace("Jacky", "Jack") + "<br>");
document.write("Contains ack: " + str.includes("ack") + "<br>");
document.write("Starts with J: " + str.startsWith("J") + "<br>");
document.write("Ends with y: " + str.endsWith("y") + "<br>");
document.write("Index of c: " + str.indexOf("c") + "<br>");
document.write("Last Index of i: " + str.lastIndexOf("i") + "<br>");
document.write("Concatenation: " + str.concat(" Max") + "<br>");
document.write("Repeat Twice: " + str.repeat(2) + "<br>");
document.write("Trim: " + "  Max  ".trim());
</script>

</body>
</html>
